services:
  app:
    build: .
    image: ghcr.io/its-the-vibe/copilotburn:latest
    pull_policy: always
    ports:
      - "${PORT}:8080"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./config.yaml:/config.yaml:ro
    read_only: true
    # Point to your external Redis instance via config.yaml
    restart: on-failure:10
    extra_hosts:
      - "host.docker.internal:host-gateway"
